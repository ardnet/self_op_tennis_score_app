# Render Blueprint: the web app as a free Static Site (served from Render's CDN, never sleeps).
# The Live Scoreboard API runs as Supabase Edge Functions (see supabase/functions).
services:
  - type: web
    runtime: static
    name: self-operated-tennis-score
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Single-page app: /scoreboard/<CODE> and every other route load index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite bakes VITE_ variables into the build: redeploy after changing them.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
